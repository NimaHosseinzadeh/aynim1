<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اطلاعات حساب | Aynim</title>
  <link rel="icon" href="../assets/images/aynim-high-resolution-logo.png">
  <link rel="stylesheet" href="../assets/icons/remixicon/remixicon.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>

<div class="user">
  <input type="checkbox" id="user-menu-toggle" class="user__toggle" hidden>

  <aside class="user-sidebar">
    <div class="user-sidebar__profile">
      <span class="user-sidebar__avatar">م</span>
      <div class="user-sidebar__info">
        <div class="user-sidebar__name">مریم احمدی</div>
        <div class="user-sidebar__email">maryam@example.com</div>
      </div>
    </div>
    <nav class="user-sidebar__nav">
      <a href="index.html" class="user-sidebar__link"><i class="ri-dashboard-line"></i><span>داشبورد</span></a>
      <a href="orders.html" class="user-sidebar__link"><i class="ri-shopping-bag-3-line"></i><span>سفارش‌های من</span></a>
      <a href="transactions.html" class="user-sidebar__link"><i class="ri-wallet-3-line"></i><span>تراکنش‌ها</span></a>
      <a href="wishlist.html" class="user-sidebar__link"><i class="ri-heart-line"></i><span>علاقه‌مندی‌ها</span></a>
      <a href="addresses.html" class="user-sidebar__link"><i class="ri-map-pin-line"></i><span>آدرس‌ها</span></a>
      <a href="profile.html" class="user-sidebar__link user-sidebar__link--active"><i class="ri-user-3-line"></i><span>اطلاعات حساب</span></a>
      <a href="security.html" class="user-sidebar__link"><i class="ri-shield-keyhole-line"></i><span>امنیت</span></a>
      <a href="settings.html" class="user-sidebar__link"><i class="ri-settings-3-line"></i><span>تنظیمات</span></a>
    </nav>
    <div class="user-sidebar__footer">
      <a href="../pages/login.html" class="user-sidebar__logout"><i class="ri-logout-box-r-line"></i><span>خروج از حساب</span></a>
    </div>
  </aside>

  <div class="user-main">
    <header class="user-topbar">
      <label for="user-menu-toggle" class="user-topbar__toggle" aria-label="منو"><i class="ri-menu-3-line"></i></label>
      <span class="user-topbar__title">اطلاعات حساب</span>
      <div class="user-topbar__actions">
        <a href="../pages/wishlist.html" class="user-topbar__action" title="علاقه‌مندی‌ها"><i class="ri-heart-line"></i></a>
        <a href="../pages/cart.html" class="user-topbar__action" title="سبد خرید"><i class="ri-shopping-bag-line"></i><span class="user-topbar__count">۲</span></a>
      </div>
    </header>

    <main class="user-content">
      <div class="user-content__inner">

        <nav class="breadcrumb">
          <ol>
            <li><a href="index.html">داشبورد</a></li>
            <li>اطلاعات حساب</li>
          </ol>
        </nav>

        <div class="user-head">
          <div>
            <h1 class="user-head__title">اطلاعات حساب</h1>
            <p class="user-head__desc">اطلاعات شخصی خود را به‌روز نگه دارید</p>
          </div>
        </div>

        <section class="card">
          <div class="card__body">
            <form>
              <div class="form-grid">
                <div class="field">
                  <label class="field__label field__label--required" for="first">نام</label>
                  <input class="field__input" id="first" type="text" value="مریم">
                </div>
                <div class="field">
                  <label class="field__label field__label--required" for="last">نام خانوادگی</label>
                  <input class="field__input" id="last" type="text" value="احمدی">
                </div>
                <div class="field">
                  <label class="field__label" for="email">ایمیل</label>
                  <input class="field__input" id="email" type="email" value="maryam@example.com">
                </div>
                <div class="field">
                  <label class="field__label" for="phone">شماره موبایل</label>
                  <input class="field__input" id="phone" type="tel" value="۰۹۱۲۳۴۵۶۷۸۹">
                </div>
                <div class="field">
                  <label class="field__label" for="birth">تاریخ تولد</label>
                  <input class="field__input" id="birth" type="text" value="۱۳۷۲/۰۵/۱۲">
                </div>
                <div class="field">
                  <label class="field__label" for="gender">جنسیت</label>
                  <select class="field__select" id="gender">
                    <option>زن</option>
                    <option>مرد</option>
                    <option>ترجیح می‌دهم نگویم</option>
                  </select>
                </div>
              </div>
              <div class="form-actions">
                <a href="index.html" class="btn btn--outline">انصراف</a>
                <button type="submit" class="btn btn--primary"><i class="ri-check-line"></i> ذخیره تغییرات</button>
              </div>
            </form>
          </div>
        </section>

      </div>
    </main>
  </div>

  <label for="user-menu-toggle" class="user-overlay"></label>
</div>

</body>
</html>
